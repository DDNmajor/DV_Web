<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Ayame Replay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/auth.js"></script>
</head>
<body>
  <main class="wrap">
    <section class="panel auth-box">
      <h1>Đăng nhập</h1>
      <form id="auth-form" data-mode="login" novalidate>
        <div>
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="btn btn-primary" type="submit">Đăng nhập</button>
        <p class="muted" style="margin:0">Chưa có tài khoản? <a id="switch-link" href="/register">Đăng ký</a> — chỉ cần tên và mật khẩu.</p>
      </form>
    </section>
  </main>
</body>
</html>
